<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ψηφιακή Κάρτα Εργασίας — Moderator (Live)</title>
<style>
    /* ══════════════════════════════════════════════════════════════════
       DESIGN TOKENS — light theme, blue + green brand palette
       (aligned with the rest of the townhall deliverables)
       Every raw colour lives here; everything below uses var().
       ══════════════════════════════════════════════════════════════════ */
    :root {
        /* ── Brand ─────────────────────────────────────────────────── */
        --deloitte-green:      #86BC25;   /* accent / "correct" signal    */
        --deloitte-green-dark: #5B8014;
        --green-ink:           #3F6009;   /* green that reads on white    */
        --green-tint:          #F1F8E3;
        --green-tint-2:        #E4F2CC;
        --brand-blue:          #0066CC;   /* primary action / data        */
        --brand-blue-dark:     #004E9E;
        --brand-cyan:          #00A3E0;
        --blue-tint:           #EBF3FB;
        --blue-tint-2:         #D8E8F8;

        /* ── Surfaces ──────────────────────────────────────────────── */
        --bg-color:    #F4F7FB;           /* page                        */
        --bg-color-2:  #FFFFFF;           /* cards, bars, panels         */
        --bg-color-3:  #EEF3F9;           /* recessed (tracks, chips)    */
        --hair:        #E2E8F0;
        --hair-strong: #C9D6E5;

        /* ── Text ──────────────────────────────────────────────────── */
        --text-color: #10233A;
        --text-dim:   #5B6B7F;

        /* ── Status ────────────────────────────────────────────────── */
        --error-red:  #C8102E;
        --error-tint: #FDEDEF;
        --warn-amber: #A66A00;
        --warn-tint:  #FCF3E2;
        --info-blue:  #0066CC;

        /* ── Overlay (QR takeover — dark so the code pops on screen) ─ */
        --overlay:    rgba(9, 24, 43, 0.94);
        --on-overlay: #C7D6E6;

        /* ── Shape ─────────────────────────────────────────────────── */
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 18px;
        --sh-1: 0 1px 2px rgba(16, 35, 58, 0.06);
        --sh-2: 0 6px 18px rgba(16, 35, 58, 0.08);
        --sh-3: 0 18px 44px rgba(16, 35, 58, 0.16);
        --focus-ring: 0 0 0 3px rgba(0, 102, 204, 0.20);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', 'Open Sans', Arial, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
    }

    /* ---------- Passphrase gate ---------- */
    #gate {
        position: fixed; inset: 0; z-index: 2000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--bg-color-2);
        background-image: radial-gradient(120% 80% at 50% 0%, var(--blue-tint) 0%, var(--bg-color-2) 62%);
        gap: 18px;
    }
    #gate h1 { color: var(--brand-blue-dark); font-size: 22px; margin: 0; }
    #gate input {
        background: var(--bg-color-2); border: 1px solid var(--hair-strong); color: var(--text-color);
        padding: 12px 16px; border-radius: var(--r-sm); font-size: 16px; width: 260px; text-align: center;
        box-shadow: var(--sh-1); font-family: inherit;
    }
    #gate input:focus { outline: none; border-color: var(--brand-blue); box-shadow: var(--focus-ring); }
    #gate button {
        background: var(--brand-blue); border: none; color: var(--bg-color-2); font-weight: 700;
        padding: 12px 28px; border-radius: var(--r-sm); font-size: 15px; cursor: pointer;
        box-shadow: var(--sh-2); font-family: inherit;
    }
    #gate button:hover { background: var(--brand-blue-dark); }
    #gate .err { color: var(--error-red); font-size: 13px; min-height: 16px; font-weight: 600; }

    /* ---------- Header ---------- */
    .header {
        position: sticky; top: 0; z-index: 20;
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 28px 14px; background: var(--bg-color-2);
        border-bottom: 1px solid var(--hair); box-shadow: var(--sh-1);
        flex-wrap: wrap; gap: 10px;
    }
    .header::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, var(--deloitte-green), var(--brand-blue));
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--deloitte-green); box-shadow: 0 0 0 4px var(--green-tint);
    }
    .brand h1 { font-size: 19px; margin: 0; color: var(--text-color); letter-spacing: -0.2px; }
    .brand .tag { color: var(--text-dim); font-size: 13px; }
    .hdr-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pill {
        display: flex; align-items: center; gap: 6px; background: var(--blue-tint);
        border: 1px solid var(--blue-tint-2); border-radius: 20px; padding: 6px 14px;
        font-size: 13px; color: var(--brand-blue-dark); font-weight: 600;
    }
    .pill .n { color: var(--brand-blue); font-weight: 800; font-size: 15px; }
    .icon-btn {
        background: var(--bg-color-2); border: 1px solid var(--hair-strong); color: var(--text-color);
        width: 38px; height: 38px; border-radius: var(--r-sm); cursor: pointer; font-size: 16px;
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:hover { border-color: var(--brand-blue); background: var(--blue-tint); }

    /* ---------- QR overlay (shows ONLY the QR code, nothing else) ---------- */
    #joinPanel {
        display: none; position: fixed; inset: 0; z-index: 999;
        background: var(--overlay);
        align-items: center; justify-content: center; cursor: pointer;
    }
    #joinPanel .qrbox {
        background: var(--bg-color-2); padding: 28px; border-radius: var(--r-lg); line-height: 0;
        box-shadow: 0 0 0 8px rgba(134, 188, 37, 0.30), var(--sh-3);
    }
    #joinPanel .qr-hint {
        position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
        color: var(--on-overlay); font-size: 13px; letter-spacing: 0.5px;
    }
    /* hidden but still present in DOM so the auto-detected audience URL logic keeps working */
    #audienceUrlInput, #joinPanel .info { display: none; }

    /* ---------- Slide area (reused look & feel) ---------- */
    .container { max-width: 900px; margin: 0 auto; padding: 40px 30px; min-height: calc(100vh - 152px); }
    .scenario-title {
        display: flex; align-items: center; gap: 14px; color: var(--green-ink);
        font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 18px;
    }
    .badge-icon {
        font-size: 22px; width: 44px; height: 44px; flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--green-tint); border-radius: var(--r-md);
    }
    .question { font-size: 24px; font-weight: 600; margin-bottom: 26px; line-height: 1.4; color: var(--text-color); }
    .options { display: flex; flex-direction: column; gap: 14px; }
    .option-row {
        display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--r-md);
        border: 1px solid var(--hair); background: var(--bg-color-2); font-size: 17px;
        box-shadow: var(--sh-1); transition: border-color 0.25s ease, background 0.25s ease;
    }
    .option-row .key-hint {
        display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
        border-radius: 50%; background: var(--bg-color-3); color: var(--text-dim);
        font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .option-row .bar-wrap { flex: 1; }
    .option-row .bar-track { background: var(--bg-color-3); border-radius: 6px; height: 10px; overflow: hidden; margin-top: 8px; }
    .option-row .bar-fill { height: 100%; background: var(--info-blue); border-radius: 6px; transition: width 0.5s ease; }
    .option-row.correct {
        border-color: var(--deloitte-green); background: var(--green-tint);
        box-shadow: inset 4px 0 0 var(--deloitte-green), var(--sh-1);
    }
    .option-row.correct .key-hint { background: var(--green-tint-2); color: var(--green-ink); }
    .option-row.correct .bar-fill { background: var(--deloitte-green); }
    .option-row .pct { font-size: 13px; color: var(--text-dim); margin-top: 4px; display: block; }
    .vote-counter { color: var(--text-dim); font-size: 15px; margin: 10px 0 20px; }
    .explanation {
        margin-top: 26px; padding: 20px 22px; border-radius: var(--r-md);
        border-left: 4px solid var(--deloitte-green);
        background: linear-gradient(90deg, var(--green-tint) 0%, var(--blue-tint) 100%);
        font-size: 17px; line-height: 1.55; color: var(--text-color); display: none;
    }
    .explanation.show { display: block; }
    .explanation .citation { display: block; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); font-style: italic; }

    .slide-plain h2 { color: var(--brand-blue-dark); font-size: 26px; margin: 10px 0 6px; letter-spacing: -0.3px; }
    .slide-plain h2::after {
        content: ''; display: block; width: 112px; height: 4px; margin-top: 12px; border-radius: 2px;
        background: linear-gradient(90deg, var(--deloitte-green), var(--brand-blue));
    }
    .slide-plain p { font-size: 18px; color: var(--text-dim); line-height: 1.6; }
    .agenda-list { list-style: none; padding: 0; margin: 0; max-width: 640px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
    .agenda-list li {
        display: flex; align-items: center; gap: 14px; padding: 14px 18px;
        background: var(--bg-color-2); border: 1px solid var(--hair); border-left: 3px solid var(--deloitte-green);
        border-radius: var(--r-md); box-shadow: var(--sh-1);
    }
    .agenda-list .a-icon { font-size: 22px; width: 30px; text-align: center; }
    .agenda-list .a-count { margin-left: auto; color: var(--brand-blue); font-size: 13px; font-weight: 600; }
    .rules-list { list-style: none; padding: 0; margin: 20px 0; display: flex; flex-direction: column; gap: 10px; }
    .rules-list li {
        padding: 14px 18px; font-size: 17px; line-height: 1.5;
        background: var(--bg-color-2); border: 1px solid var(--hair); border-left: 3px solid var(--brand-cyan);
        border-radius: var(--r-md); box-shadow: var(--sh-1);
    }
    .final-score {
        margin-top: 20px; padding: 22px 24px; background: var(--bg-color-2);
        border: 1px solid var(--hair); border-top: 3px solid var(--deloitte-green);
        border-radius: var(--r-md); box-shadow: var(--sh-2);
    }
    .final-score .fs-num { font-size: 46px; font-weight: 800; color: var(--brand-blue); line-height: 1.1; }
    .final-score .fs-tier { font-size: 17px; color: var(--text-dim); margin-top: 6px; }

    /* ---------- Bottom controls ---------- */
    .controls {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 28px; background: var(--bg-color-2);
        border-top: 1px solid var(--hair); gap: 14px; flex-wrap: wrap;
    }
    .nav-btn {
        background: var(--bg-color-2); border: 1px solid var(--hair-strong); color: var(--text-color);
        padding: 12px 24px; border-radius: var(--r-sm); cursor: pointer; font-size: 15px;
        font-family: inherit; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .nav-btn:hover { background: var(--blue-tint); border-color: var(--brand-blue); color: var(--brand-blue-dark); }
    .nav-btn.primary {
        background: var(--brand-blue); border-color: var(--brand-blue); color: var(--bg-color-2);
        font-weight: 700; box-shadow: var(--sh-2);
    }
    .nav-btn.primary:hover { background: var(--brand-blue-dark); border-color: var(--brand-blue-dark); color: var(--bg-color-2); }
    .nav-btn.primary.locked {
        background: var(--bg-color-3); border-color: var(--hair); color: var(--text-dim);
        cursor: not-allowed; box-shadow: none;
    }
    .nav-btn.reveal {
        background: var(--deloitte-green); border-color: var(--deloitte-green); color: var(--green-ink);
        font-weight: 700; box-shadow: var(--sh-2);
    }
    .nav-btn.reveal:hover { background: var(--deloitte-green); border-color: var(--deloitte-green-dark); color: var(--green-ink); filter: brightness(1.05); }
    .nav-btn.reveal:disabled {
        background: var(--bg-color-3); border-color: var(--hair); color: var(--text-dim);
        cursor: not-allowed; box-shadow: none; filter: none;
    }
    .nav-btn.danger { border-color: var(--error-red); color: var(--error-red); }
    .nav-btn.danger:hover { background: var(--error-red); border-color: var(--error-red); color: var(--bg-color-2); }
    .progress-text { text-align: center; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<div id="gate">
    <h1>🔒 Moderator Access</h1>
    <input type="password" id="gatePass" placeholder="Κωδικός συντονιστή" autofocus>
    <button onclick="tryUnlock()">Είσοδος</button>
    <div class="err" id="gateErr"></div>
</div>

<div id="app" style="display:none;">
    <div class="header">
        <div class="brand">
            <span class="dot"></span>
            <h1>Ψηφιακή Κάρτα Εργασίας</h1>
            <span class="tag" id="sectionTag">Live Townhall Quiz — Moderator</span>
        </div>
        <div class="hdr-controls">
            <div class="pill">👥 Συνδεδεμένοι <span class="n" id="presenceCount">0</span></div>
            <div class="pill">🖐 Απαντήσεις <span class="n" id="voteCount">0</span></div>
            <button class="icon-btn" id="qrToggleBtn" onclick="toggleJoinPanel()" title="Εμφάνιση link/QR">🔗</button>
            <button class="icon-btn" onclick="toggleMute()" id="muteBtn" title="Ήχος">🔊</button>
            <button class="icon-btn" onclick="resetSession()" title="Επαναφορά συνεδρίας">↺</button>
        </div>
    </div>

    <div id="joinPanel" onclick="toggleJoinPanel()">
        <div class="qrbox" id="qrcode"></div>
        <div class="qr-hint">Πάτησε οπουδήποτε για κλείσιμο</div>
        <div class="info">
            <label>Link για το κοινό (ανοίγει στο κινητό):</label>
            <input type="text" id="audienceUrlInput" onchange="saveAudienceUrl()">
            <button class="small" onclick="regenerateQR()">Ενημέρωση QR</button>
        </div>
    </div>

    <div class="container" id="slideContainer"></div>

    <div class="controls">
        <button class="nav-btn" id="prevBtn" onclick="prevSlide()">← Προηγούμενο</button>
        <div class="progress-text">
            <span id="progress">1 / 1</span>
            <button class="nav-btn reveal" id="revealBtn" onclick="revealAnswer()" style="display:none; margin-left:14px;">👁 Αποκάλυψη Απάντησης</button>
        </div>
        <button class="nav-btn primary" id="nextBtn" onclick="nextSlide()">Επόμενο →</button>
    </div>
</div>

<!-- Firebase (compat SDK — plain <script> tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="quiz-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
/* ================= CONFIG ================= */
const MOD_PASSPHRASE = "deloitte2026"; // change this before the event if you want a different code
const { SECTIONS, deck, QUESTION_INDEXES } = window.QUIZ_DATA;

/* ================= GATE ================= */
function tryUnlock() {
    const val = document.getElementById('gatePass').value;
    if (val === MOD_PASSPHRASE) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        initApp();
    } else {
        document.getElementById('gateErr').textContent = 'Λάθος κωδικός.';
    }
}
document.getElementById('gatePass').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

/* ================= FIREBASE ================= */
firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database();
const stateRef = db.ref('session/state');
const votesRef = db.ref('session/votes');
const presenceRef = db.ref('session/presence');

let currentSlide = 0;
let revealed = false;
let muted = false;
let currentVotes = {}; // {optionIndex: count} for the active slide

function initApp() {
    setupAudienceUrl();
    listenPresence();
    listenState();
    renderSlide(); // initial paint before first snapshot arrives
}

/* ================= PRESENCE & VOTES (live) ================= */
function listenPresence() {
    presenceRef.on('value', (snap) => {
        const val = snap.val() || {};
        document.getElementById('presenceCount').textContent = Object.keys(val).length;
    });
}

let votesListenerRef = null;
function listenVotesForSlide(index) {
    if (votesListenerRef) votesListenerRef.off();
    votesListenerRef = votesRef.child(String(index));
    votesListenerRef.on('value', (snap) => {
        const val = snap.val() || {};
        const counts = {};
        Object.values(val).forEach((opt) => { counts[opt] = (counts[opt] || 0) + 1; });
        currentVotes = counts;
        const total = Object.values(counts).reduce((a, b) => a + b, 0);
        document.getElementById('voteCount').textContent = total;
        updateVoteBars();
    });
}

/* ================= STATE SYNC ================= */
function listenState() {
    stateRef.on('value', (snap) => {
        const val = snap.val() || { slide: 0, revealed: false };
        currentSlide = val.slide || 0;
        revealed = !!val.revealed;
        listenVotesForSlide(currentSlide);
        renderSlide();
    });
}

function pushState(partial) {
    stateRef.update(partial);
}

/* ================= NAVIGATION ================= */
function nextSlide() {
    const slide = deck[currentSlide];
    const isQuestion = slide.type === 'scenario' || slide.type === 'rapidfire';
    if (isQuestion && !revealed) return; // locked until revealed
    if (currentSlide < deck.length - 1) {
        pushState({ slide: currentSlide + 1, revealed: false });
    }
}
function prevSlide() {
    if (currentSlide > 0) {
        pushState({ slide: currentSlide - 1, revealed: false });
    }
}
function revealAnswer() {
    pushState({ revealed: true });
}
function resetSession() {
    if (!confirm('Σίγουρα θέλεις να μηδενίσεις όλες τις ψήφους και να ξαναρχίσεις από την αρχή;')) return;
    votesRef.remove();
    presenceRef.remove();
    stateRef.set({ slide: 0, revealed: false });
}

/* ================= RENDER ================= */
function sectionRefTag(section) {
    const s = SECTIONS[section];
    return s ? `${s.icon} ${s.name}` : "";
}

function renderSlide() {
    const slide = deck[currentSlide];
    const container = document.getElementById('slideContainer');
    const isQuestion = slide.type === 'scenario' || slide.type === 'rapidfire';

    let tagText = "Live Townhall Quiz — Moderator";
    if (slide.section) tagText = sectionRefTag(slide.section);
    else if (slide.type === 'summary') tagText = "🏁 Σύνοψη & Τελικό Σκορ";
    else if (slide.type === 'agenda') tagText = "Ατζέντα";
    document.getElementById('sectionTag').textContent = tagText;

    document.getElementById('progress').textContent = `${currentSlide + 1} / ${deck.length}`;
    document.getElementById('prevBtn').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
    document.getElementById('nextBtn').style.visibility = currentSlide === deck.length - 1 ? 'hidden' : 'visible';

    const locked = isQuestion && !revealed;
    document.getElementById('nextBtn').classList.toggle('locked', locked);
    document.getElementById('revealBtn').style.display = (isQuestion && !revealed) ? 'inline-block' : 'none';

    if (slide.type === 'intro') {
        container.innerHTML = `
            <div class="slide-plain">
                <h2>${slide.title}</h2>
                <p>${slide.subtitle}</p>
                <div class="rules-list"><ul style="list-style:none;padding:0;">
                    ${slide.rules.map(r => `<li>${r}</li>`).join('')}
                </ul></div>
            </div>`;
    } else if (slide.type === 'agenda') {
        container.innerHTML = `
            <div class="scenario-title"><span>Ατζέντα Σημερινού Quiz</span></div>
            <ul class="agenda-list">
                ${slide.items.map(it => `<li><span class="a-icon">${it.icon}</span><span>${it.name}</span><span class="a-count">${it.count}</span></li>`).join('')}
            </ul>`;
    } else if (slide.type === 'divider') {
        const s = SECTIONS[slide.section];
        container.innerHTML = `
            <div class="slide-plain">
                <div style="color:var(--text-dim);font-size:13px;">Ενότητα ${slide.section} από 5</div>
                <div style="font-size:44px;margin:10px 0;">${s.icon}</div>
                <h2>${s.name}</h2>
                <p>${slide.desc}</p>
                <div style="color:var(--green-ink);font-weight:700;">${slide.count}</div>
            </div>`;
    } else if (slide.type === 'info') {
        container.innerHTML = `
            <div class="slide-plain">
                <div style="color:var(--warn-amber);text-transform:uppercase;font-size:13px;letter-spacing:1.2px;font-weight:700;">${slide.tag}</div>
                <h2>${slide.lead}</h2>
                ${slide.cards.map(c => `<div style="margin:14px 0;"><strong style="color:var(--error-red);">${c.h}:</strong> ${c.p}</div>`).join('')}
                <div class="explanation show"><span class="citation">📖 ${slide.footnote}</span></div>
            </div>`;
    } else if (slide.type === 'scenario' || slide.type === 'rapidfire') {
        let optionsHtml = '';
        slide.options.forEach((opt, i) => {
            optionsHtml += `
                <div class="option-row" id="opt-${i}">
                    <span class="key-hint">${i + 1}</span>
                    <div class="bar-wrap">
                        <div>${opt}</div>
                        <div class="bar-track"><div class="bar-fill" id="bar-${i}" style="width:0%"></div></div>
                        <span class="pct" id="pct-${i}"></span>
                    </div>
                </div>`;
        });
        container.innerHTML = `
            <div class="scenario-title">
                <span class="badge-icon">${slide.icon || ''}</span>
                <span>${slide.title}</span>
            </div>
            <div class="question">${slide.question}</div>
            <div class="vote-counter">🖐 Το κοινό ψηφίζει από το κινητό του...</div>
            <div class="options">${optionsHtml}</div>
            <div class="explanation" id="explanation">
                <strong>Επεξήγηση:</strong> ${slide.explanation}
                ${slide.ref ? `<span class="citation">📖 ${slide.ref}</span>` : ''}
            </div>`;
        updateVoteBars();
    } else if (slide.type === 'summary') {
        const stats = computeRoomStats();
        container.innerHTML = `
            <div class="scenario-title" style="color:var(--green-ink);"><span>🏁 Σύνοψη</span></div>
            <div class="question" style="color:var(--green-ink);font-size:26px;">Οι 4 Χρυσοί Κανόνες της Κάρτας</div>
            <ul class="rules-list">${slide.rules.map(r => `<li>${r}</li>`).join('')}</ul>
            <div class="final-score">
                <div class="fs-num">${stats.pct}%</div>
                <div class="fs-tier">${stats.tier} — μέση ακρίβεια αίθουσας σε ${stats.answered}/${QUESTION_INDEXES.length} ερωτήσεις</div>
            </div>
            <div class="explanation show"><span class="citation">${slide.sources}</span></div>`;
    }
}

function updateVoteBars() {
    const slide = deck[currentSlide];
    if (!slide || !(slide.type === 'scenario' || slide.type === 'rapidfire')) return;
    const total = Object.values(currentVotes).reduce((a, b) => a + b, 0);

    slide.options.forEach((opt, i) => {
        const row = document.getElementById(`opt-${i}`);
        const bar = document.getElementById(`bar-${i}`);
        const pctEl = document.getElementById(`pct-${i}`);
        if (!row) return;
        const count = currentVotes[i] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;

        if (revealed) {
            bar.style.width = pct + '%';
            pctEl.textContent = `${count} ψήφοι (${pct}%)`;
            row.classList.toggle('correct', i === slide.correct);
        } else {
            // hide the breakdown pre-reveal so the room doesn't just follow the crowd
            bar.style.width = '0%';
            pctEl.textContent = '';
            row.classList.remove('correct');
        }
    });

    const explanation = document.getElementById('explanation');
    if (explanation) explanation.classList.toggle('show', revealed);
    document.querySelector('.vote-counter').textContent = revealed
        ? `✅ Αποκαλύφθηκε η σωστή απάντηση — σύνολο ${total} ψήφων`
        : `🖐 Το κοινό ψηφίζει από το κινητό του... (${total} έχουν απαντήσει)`;
}

function computeRoomStats() {
    // best-effort synchronous snapshot using the last known values we've received live;
    // for a fully accurate final tally, this reads whatever is cached from prior listeners.
    let sumPct = 0, answered = 0;
    QUESTION_INDEXES.forEach((idx) => {
        // we only have live data for the slide currently being viewed; for a true final
        // readout, actual per-slide data is fetched on demand below.
    });
    return { pct: 0, tier: 'Υπολογισμός...', answered: 0 };
}

// Real final stats: fetch all vote nodes once when the summary slide is shown.
async function computeRoomStatsAsync() {
    const snap = await votesRef.get();
    const allVotes = snap.val() || {};
    let sumPct = 0, answeredQuestions = 0;
    QUESTION_INDEXES.forEach((idx) => {
        const slide = deck[idx];
        const votesForSlide = allVotes[idx] || {};
        const values = Object.values(votesForSlide);
        if (values.length === 0) return;
        const correctCount = values.filter(v => v === slide.correct).length;
        sumPct += (correctCount / values.length) * 100;
        answeredQuestions++;
    });
    const pct = answeredQuestions > 0 ? Math.round(sumPct / QUESTION_INDEXES.length) : 0;
    let tier = "📚 Ας τα ξαναδούμε μαζί με το HR!";
    if (pct >= 90) tier = "🏆 Άριστα! Η αίθουσα ξέρει τη διαδικασία απέξω κι ανακατωτά.";
    else if (pct >= 70) tier = "👏 Πολύ καλά! Λίγες λεπτομέρειες ακόμα να θυμόμαστε.";
    else if (pct >= 50) tier = "🙂 Καλή αρχή — ας κρατήσουμε τους 4 Χρυσούς Κανόνες.";
    return { pct, tier, answered: answeredQuestions };
}

/* patch: re-render the summary slide once the async stats resolve */
const _origRenderSlide = renderSlide;
renderSlide = function () {
    _origRenderSlide();
    if (deck[currentSlide].type === 'summary') {
        computeRoomStatsAsync().then((stats) => {
            const numEl = document.querySelector('.fs-num');
            const tierEl = document.querySelector('.fs-tier');
            if (numEl) numEl.textContent = stats.pct + '%';
            if (tierEl) tierEl.textContent = `${stats.tier} — μέση ακρίβεια αίθουσας σε ${stats.answered}/${QUESTION_INDEXES.length} ερωτήσεις`;
        });
    }
};

/* ================= JOIN PANEL / QR ================= */
const LIVE_AUDIENCE_URL = "https://hliasd6.github.io/townhall-quiz/audience.html";
function setupAudienceUrl() {
    const isHosted = /^https?:/.test(location.href);
    const fallback = isHosted ? location.href.replace(/moderator\.html.*$/, 'audience.html') : LIVE_AUDIENCE_URL;
    const saved = localStorage.getItem('audienceUrl') || fallback;
    document.getElementById('audienceUrlInput').value = saved;
    renderQR(saved);
}
function saveAudienceUrl() {
    const val = document.getElementById('audienceUrlInput').value.trim();
    localStorage.setItem('audienceUrl', val);
}
function regenerateQR() {
    saveAudienceUrl();
    renderQR(document.getElementById('audienceUrlInput').value.trim());
}
function renderQR(url) {
    const box = document.getElementById('qrcode');
    box.innerHTML = '';
    if (!url) return;
    try { new QRCode(box, { text: url, width: 340, height: 340 }); } catch (e) { /* qrcode lib not loaded (offline) */ }
}
function toggleJoinPanel() {
    const p = document.getElementById('joinPanel');
    p.style.display = p.style.display === 'none' ? 'flex' : 'none';
}

function toggleMute() {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
}

/* ================= KEYBOARD ================= */
window.addEventListener('keydown', (e) => {
    if (document.getElementById('gate').style.display === 'none') {
        if (['ArrowRight', 'PageDown'].includes(e.key)) nextSlide();
        else if (['ArrowLeft', 'PageUp'].includes(e.key)) prevSlide();
        else if (e.key.toLowerCase() === 'r') revealAnswer();
    }
});
</script>
