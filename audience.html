<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ψηφιακή Κάρτα Εργασίας — Live Quiz</title>
<style>
    :root {
        --deloitte-green: #86BC25;
        --bg-color: #0A0A0A;
        --bg-color-2: #141414;
        --text-color: #FFFFFF;
        --text-dim: #9A9A9A;
        --error-red: #E3000F;
        --warn-amber: #C9A227;
        --info-blue: #2E7DD1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; height: 100%;
        font-family: 'Segoe UI', 'Open Sans', Arial, sans-serif;
        background: var(--bg-color); color: var(--text-color);
    }

    /* ---------- Join screen ---------- */
    #joinScreen {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; padding: 24px; text-align: center; z-index: 500;
    }
    #joinScreen .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--deloitte-green); margin-bottom: 6px; }
    #joinScreen h1 { font-size: 22px; margin: 0; }
    #joinScreen p { color: var(--text-dim); font-size: 15px; max-width: 320px; }
    #joinScreen button {
        background: var(--deloitte-green); border: none; color: black; font-weight: 800;
        padding: 16px 36px; border-radius: 10px; font-size: 17px; cursor: pointer;
    }

    /* ---------- Top bar ---------- */
    .topbar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; border-bottom: 2px solid var(--deloitte-green); position: sticky; top: 0;
        background: var(--bg-color); z-index: 10;
    }
    .topbar .brand { font-size: 14px; font-weight: 700; }
    .topbar .brand .tag { display: block; color: var(--text-dim); font-size: 11px; font-weight: 400; }
    .scorepill {
        background: var(--bg-color-2); border: 1px solid #262626; border-radius: 16px;
        padding: 5px 12px; font-size: 12px; display: flex; gap: 6px; align-items: center;
    }
    .scorepill .n { color: var(--deloitte-green); font-weight: 800; }

    /* ---------- Content ---------- */
    .wrap { padding: 20px 18px 100px; max-width: 560px; margin: 0 auto; }
    .waiting { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 16px; }
    .scenario-title { display: flex; align-items: center; gap: 8px; color: var(--deloitte-green); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
    .badge-icon { font-size: 20px; }
    .question { font-size: 19px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        padding: 15px 16px; border-radius: 10px; border: 1px solid #333; background: var(--bg-color-2);
        color: var(--text-color); font-size: 15.5px; cursor: pointer; font-family: inherit;
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn .key-hint {
        display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
        border-radius: 50%; background: #262626; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .option-btn.selected { border-color: var(--info-blue); background: rgba(46,125,209,0.15); }
    .option-btn.correct { background: var(--deloitte-green); border-color: var(--deloitte-green); color: black; font-weight: 700; }
    .option-btn.wrong { background: var(--error-red); border-color: var(--error-red); color: white; font-weight: 700; }
    .option-btn:disabled { cursor: default; opacity: 0.85; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { margin-left:0; } 20% { margin-left:-6px; } 40% { margin-left:6px; } 60% { margin-left:-4px; } 80% { margin-left:4px; } }
    .option-btn.correct { animation: pop 0.4s ease; }
    .option-btn.wrong { animation: shake 0.4s ease; }

    .vote-status { text-align: center; color: var(--text-dim); font-size: 13px; margin: 14px 0; }
    .explanation {
        margin-top: 20px; padding: 16px; border-radius: 10px; border-left: 4px solid var(--deloitte-green);
        background: rgba(255,255,255,0.04); font-size: 15px; line-height: 1.5; display: none;
    }
    .explanation.show { display: block; }
    .explanation .citation { display: block; margin-top: 8px; font-size: 11.5px; color: var(--text-dim); font-style: italic; }

    .slide-plain h2 { color: var(--deloitte-green); font-size: 21px; }
    .slide-plain p { font-size: 15px; color: var(--text-dim); line-height: 1.55; }
    .agenda-list { list-style: none; padding: 0; margin: 0; }
    .agenda-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
    .agenda-list .a-count { margin-left: auto; color: var(--text-dim); font-size: 12px; }
    .rules-list { list-style: none; padding: 0; margin: 16px 0; }
    .rules-list li { padding: 10px 0; border-bottom: 1px solid #222; font-size: 15px; line-height: 1.45; }
    .final-score { margin-top: 14px; }
    .final-score .fs-num { font-size: 38px; font-weight: 800; color: var(--deloitte-green); }
    .final-score .fs-tier { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
</style>
</head>
<body>

<div id="joinScreen">
    <span class="dot"></span>
    <h1>Ψηφιακή Κάρτα Εργασίας</h1>
    <p>Πατήστε παρακάτω για να μπείτε στο live quiz. Θα βλέπετε την ίδια ερώτηση με τον προβολέα και θα ψηφίζετε από εδώ.</p>
    <button onclick="joinQuiz()">🖐 Μπες στο Live Quiz</button>
</div>

<div id="app" style="display:none;">
    <div class="topbar">
        <div class="brand">Ψηφιακή Κάρτα Εργασίας<span class="tag" id="sectionTag">Live Quiz</span></div>
        <div class="scorepill">Το σκορ μου <span class="n" id="myScore">0</span>/<span id="myTotal">0</span></div>
    </div>
    <div class="wrap" id="slideContainer"></div>
</div>

<canvas id="confetti-canvas"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="quiz-data.js"></script>
<script>
const { SECTIONS, deck, QUESTION_INDEXES } = window.QUIZ_DATA;

/* ================= CLIENT IDENTITY ================= */
function getClientId() {
    let id = localStorage.getItem('clientId');
    if (!id) {
        id = 'p_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('clientId', id);
    }
    return id;
}
const clientId = getClientId();

/* personal answer record kept locally: { [slideIndex]: optionIndex } */
function getMyAnswers() {
    try { return JSON.parse(localStorage.getItem('myAnswers') || '{}'); } catch (e) { return {}; }
}
function saveMyAnswer(slideIndex, optionIndex) {
    const all = getMyAnswers();
    all[slideIndex] = optionIndex;
    localStorage.setItem('myAnswers', JSON.stringify(all));
}

/* ================= FIREBASE ================= */
firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database();
const stateRef = db.ref('session/state');
const votesRef = db.ref('session/votes');
const presenceRef = db.ref('session/presence');

let currentSlide = 0;
let revealed = false;
let muted = false;

function joinQuiz() {
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    getAudioCtx(); // unlock audio with this user gesture

    // presence: mark connected, auto-remove on disconnect
    const myPresenceRef = presenceRef.child(clientId);
    myPresenceRef.set(firebase.database.ServerValue.TIMESTAMP);
    myPresenceRef.onDisconnect().remove();

    document.getElementById('myTotal').textContent = QUESTION_INDEXES.length;
    updateMyScoreDisplay();

    stateRef.on('value', (snap) => {
        const val = snap.val() || { slide: 0, revealed: false };
        currentSlide = val.slide || 0;
        revealed = !!val.revealed;
        renderSlide();
    });
}

/* ================= SCORING (client-side only, fixed denominator) ================= */
function updateMyScoreDisplay() {
    const answers = getMyAnswers();
    let correctCount = 0;
    QUESTION_INDEXES.forEach((idx) => {
        const slide = deck[idx];
        if (answers[idx] !== undefined && answers[idx] === slide.correct) correctCount++;
    });
    document.getElementById('myScore').textContent = correctCount;
}

/* ================= VOTING ================= */
function submitVote(slideIndex, optionIndex) {
    const answers = getMyAnswers();
    if (answers[slideIndex] !== undefined) return; // already voted, no changing your mind
    saveMyAnswer(slideIndex, optionIndex);
    votesRef.child(String(slideIndex)).child(clientId).set(optionIndex);
    renderSlide();
}

/* ================= RENDER ================= */
function sectionRefTag(section) {
    const s = SECTIONS[section];
    return s ? `${s.icon} ${s.name}` : "";
}

function renderSlide() {
    const slide = deck[currentSlide];
    const container = document.getElementById('slideContainer');
    const isQuestion = slide.type === 'scenario' || slide.type === 'rapidfire';

    let tagText = "Live Quiz";
    if (slide.section) tagText = sectionRefTag(slide.section);
    else if (slide.type === 'summary') tagText = "🏁 Σύνοψη";
    else if (slide.type === 'agenda') tagText = "Ατζέντα";
    document.getElementById('sectionTag').textContent = tagText;

    if (slide.type === 'intro') {
        container.innerHTML = `<div class="slide-plain"><h2>${slide.title}</h2><p>${slide.subtitle}</p>
            <ul class="rules-list">${slide.rules.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
    } else if (slide.type === 'agenda') {
        container.innerHTML = `
            <div class="scenario-title"><span>Ατζέντα Σημερινού Quiz</span></div>
            <ul class="agenda-list">${slide.items.map(it => `<li><span>${it.icon}</span><span>${it.name}</span><span class="a-count">${it.count}</span></li>`).join('')}</ul>`;
    } else if (slide.type === 'divider') {
        const s = SECTIONS[slide.section];
        container.innerHTML = `
            <div class="slide-plain" style="text-align:center;">
                <div style="color:var(--text-dim);font-size:12px;">Ενότητα ${slide.section} από 5</div>
                <div style="font-size:36px;margin:10px 0;">${s.icon}</div>
                <h2>${s.name}</h2><p>${slide.desc}</p>
                <div style="color:var(--deloitte-green);font-weight:700;">${slide.count}</div>
            </div>`;
    } else if (slide.type === 'info') {
        container.innerHTML = `
            <div class="slide-plain">
                <div style="color:var(--warn-amber);text-transform:uppercase;font-size:12px;letter-spacing:1px;font-weight:700;">${slide.tag}</div>
                <h2>${slide.lead}</h2>
                ${slide.cards.map(c => `<div style="margin:12px 0;"><strong style="color:var(--error-red);">${c.h}:</strong> ${c.p}</div>`).join('')}
                <div class="explanation show"><span class="citation">📖 ${slide.footnote}</span></div>
            </div>`;
    } else if (slide.type === 'scenario' || slide.type === 'rapidfire') {
        renderQuestionSlide(slide);
    } else if (slide.type === 'summary') {
        updateMyScoreDisplay();
        const correctCount = document.getElementById('myScore').textContent;
        container.innerHTML = `
            <div class="scenario-title" style="color:var(--deloitte-green);"><span>🏁 Σύνοψη</span></div>
            <div class="question" style="color:var(--deloitte-green);">Οι 4 Χρυσοί Κανόνες της Κάρτας</div>
            <ul class="rules-list">${slide.rules.map(r => `<li>${r}</li>`).join('')}</ul>
            <div class="final-score">
                <div class="fs-num">${correctCount} / ${QUESTION_INDEXES.length}</div>
                <div class="fs-tier">Το προσωπικό σου σκορ σε αυτό το quiz</div>
            </div>
            <div class="explanation show"><span class="citation">${slide.sources}</span></div>`;
    }
}

function renderQuestionSlide(slide) {
    const container = document.getElementById('slideContainer');
    const answers = getMyAnswers();
    const myVote = answers[currentSlide];
    const hasVoted = myVote !== undefined;

    let optionsHtml = '';
    slide.options.forEach((opt, i) => {
        optionsHtml += `<button class="option-btn" id="opt-${i}" onclick="submitVote(${currentSlide}, ${i})" ${hasVoted || revealed ? 'disabled' : ''}>
            <span class="key-hint">${i + 1}</span>${opt}
        </button>`;
    });

    container.innerHTML = `
        <div class="scenario-title"><span class="badge-icon">${slide.icon || ''}</span><span>${slide.title}</span></div>
        <div class="question">${slide.question}</div>
        <div class="options">${optionsHtml}</div>
        <div class="vote-status" id="voteStatus"></div>
        <div class="explanation" id="explanation">
            <strong>Επεξήγηση:</strong> ${slide.explanation}
            ${slide.ref ? `<span class="citation">📖 ${slide.ref}</span>` : ''}
        </div>`;

    const statusEl = document.getElementById('voteStatus');
    if (revealed) {
        statusEl.textContent = hasVoted ? '' : '⏱ Δεν πρόλαβες να ψηφίσεις σε αυτή την ερώτηση.';
        // color correct/wrong, run sound + score exactly once per slide reveal
        const opts = slide.options.map((_, i) => document.getElementById(`opt-${i}`));
        opts.forEach((btn, i) => {
            btn.disabled = true;
            if (i === slide.correct) btn.classList.add('correct');
            else if (hasVoted && i === myVote) btn.classList.add('wrong');
        });
        document.getElementById('explanation').classList.add('show');
        maybePlayRevealFeedback(slide, myVote, hasVoted);
    } else if (hasVoted) {
        document.getElementById(`opt-${myVote}`).classList.add('selected');
        statusEl.textContent = '✅ Η ψήφος σου καταγράφηκε! Περιμένουμε τον συντονιστή να αποκαλύψει την απάντηση...';
    } else {
        statusEl.textContent = '🖐 Πάτησε την απάντηση που πιστεύεις σωστή.';
    }
}

/* Ensure sound/confetti/score-count fire only ONCE per slide reveal, even though
   renderSlide() can be called again (e.g. Firebase re-emits the same value). */
let lastRevealedSlideHandled = -1;
function maybePlayRevealFeedback(slide, myVote, hasVoted) {
    if (lastRevealedSlideHandled === currentSlide) return;
    lastRevealedSlideHandled = currentSlide;
    if (!hasVoted) return;
    if (myVote === slide.correct) {
        playCorrectSound();
        confettiBurst();
    } else {
        playWrongSound();
    }
    updateMyScoreDisplay();
}

/* ================= AUDIO (Web Audio API, same character as the original quiz) ================= */
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
}
function beep(freq, start, duration, gainVal, waveType) {
    if (muted) return;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(gainVal, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + start); osc.stop(ctx.currentTime + start + duration);
    } catch (e) { /* audio not critical */ }
}
function playCorrectSound() {
    beep(523.25, 0, 0.12, 0.07, 'triangle');
    beep(659.25, 0.08, 0.12, 0.07, 'triangle');
    beep(783.99, 0.16, 0.12, 0.07, 'triangle');
    beep(1046.50, 0.24, 0.30, 0.08, 'triangle');
}
function playWrongSound() {
    beep(180, 0, 0.22, 0.14, 'square');
    beep(120, 0.16, 0.32, 0.14, 'square');
}

/* ================= CONFETTI (lightweight, same idea as the main deck) ================= */
function confettiBurst() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const colors = ['#86BC25', '#FFFFFF', '#5b8014'];
    const particles = Array.from({ length: 60 }, () => ({
        x: canvas.width / 2, y: canvas.height / 3,
        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 1.5) * 10,
        size: Math.random() * 6 + 3, color: colors[Math.floor(Math.random() * colors.length)], life: 60
    }));
    let frame = 0;
    function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
            if (p.life <= 0) return;
            alive = true;
            p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        frame++;
        if (alive && frame < 90) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    tick();
}
</script>
</body>
</html>
